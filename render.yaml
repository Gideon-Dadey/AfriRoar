# AfriRoar — Render Blueprint (single Web Service)
# Connect this repo in Render → New → Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: afriror
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Required — use MongoDB Atlas (localhost will not work on Render)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      # Set to your Render URL after first deploy, e.g. https://afriror.onrender.com
      # If left empty, server uses RENDER_EXTERNAL_URL automatically.
      - key: CLIENT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: AfriRoar <afriroar.support@gmail.com>
      - key: SUPPORT_EMAIL
        value: afriroar.support@gmail.com
      # Optional Stripe / Cloudinary — leave blank until needed
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
